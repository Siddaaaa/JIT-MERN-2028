<!DOCTYPE html>
<html>
    <head>
        <title>
                Flexbox;
        </title>
        <style>
            .container{
                display:flex;
                flex-direction:column;
                background-color:lightblue;
            }
            .container div{
                background-color:lightgreen;
                margin:10px;
                padding:20px;
                font-size:30px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div> Item 1 </div>
            <div> Item 2 </div>
            <div> Item 3 </div>
            <div> Item 4 </div>
            <div> Item 5 </div>
        </div>
    </body>
</html>
